name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PDF_TO_JSON_RAG_ALLOW_MODEL_DOWNLOAD: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked-environment tool
        run: python -m pip install uv==0.12.20

      - name: Cache locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install locked test environment
        run: uv sync --frozen --extra test

      - name: Run unit tests
        if: matrix.python-version != '3.13'
        run: uv run --frozen --extra test python -m unittest discover -s tests -v

      - name: Run unit tests with branch coverage
        if: matrix.python-version == '3.13'
        run: uv run --frozen --extra test python -m coverage run -m unittest discover -s tests -v

      - name: Combine coverage from CLI subprocesses
        if: matrix.python-version == '3.13'
        run: uv run --frozen --extra test python -m coverage combine

      - name: Enforce coverage baseline
        if: matrix.python-version == '3.13'
        run: uv run --frozen --extra test python -m coverage report

      - name: Generate coverage XML
        if: matrix.python-version == '3.13'
        run: uv run --frozen --extra test python -m coverage xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-python-3.13
          path: coverage.xml

  quality:
    name: Ruff and pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PDF_TO_JSON_RAG_ALLOW_MODEL_DOWNLOAD: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install locked-environment tool
        run: python -m pip install uv==0.12.20

      - name: Cache locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}

      - name: Install locked quality environment
        run: uv sync --frozen --extra semantic --extra typecheck --extra quality

      - name: Run Ruff
        run: uv run --frozen --extra semantic --extra typecheck --extra quality ruff check .

      - name: Run mypy on the incremental strict scope
        run: uv run --frozen --extra semantic --extra typecheck --extra quality python -m mypy

      - name: Run pip-audit
        # ChromaDB has no patched release for these server-side authorization/RCE
        # advisories. This project only uses the embedded local PersistentClient;
        # it does not expose Chroma's authenticated server or collection-update API.
        # Keep the exceptions narrow so every other advisory still fails CI.
        run: >-
          uv run --frozen --extra semantic --extra typecheck --extra quality python -m pip_audit --local --skip-editable
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833
