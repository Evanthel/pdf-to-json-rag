name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PDF_TO_JSON_RAG_ALLOW_MODEL_DOWNLOAD: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    name: Ruff and pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PDF_TO_JSON_RAG_ALLOW_MODEL_DOWNLOAD: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: python -m pip install -e .

      - name: Install quality tools
        run: python -m pip install ruff pip-audit

      - name: Run Ruff
        run: ruff check .

      - name: Run pip-audit
        # ChromaDB has no patched release for these server-side authorization/RCE
        # advisories. This project only uses the embedded local PersistentClient;
        # it does not expose Chroma's authenticated server or collection-update API.
        # Keep the exceptions narrow so every other advisory still fails CI.
        run: >-
          python -m pip_audit --local --skip-editable
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833
