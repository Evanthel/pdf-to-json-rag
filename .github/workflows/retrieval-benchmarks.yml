name: Retrieval Benchmarks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      k:
        description: Retrieval top-k.
        required: false
        default: "5"
      modes:
        description: Comma-separated modes for real-ground-truth-check.
        required: false
        default: default-auto

permissions:
  contents: read

concurrency:
  group: retrieval-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-pdf-ground-truth:
    name: Public-PDF retrieval ground truth
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BENCHMARK_K: ${{ github.event.inputs.k || '5' }}
      BENCHMARK_MODES: ${{ github.event.inputs.modes || 'default-auto' }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PDF_TO_JSON_RAG_ALLOW_MODEL_DOWNLOAD: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install locked-environment tool
        run: python -m pip install uv==0.12.20

      - name: Cache locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}

      - name: Install locked benchmark environment
        run: uv sync --frozen

      - name: Cache public PDF shard
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: pdf/public-corpus
          key: public-pdf-shard-${{ hashFiles('data/eval/public_pdf_corpus_manifest.json') }}

      - name: Download and verify required public PDF shard
        run: >-
          uv run --frozen python scripts/download_public_corpus.py
          --ids
          psmi-checklist-2025
          open-data-canvas-questionnaire-2023
          irs-form-w9-2024
          --output-dir pdf/public-corpus
          --json

      - name: Run real-PDF retrieval benchmark
        run: |
          mkdir -p benchmark-results
          uv run --frozen pdf-to-json-rag real-ground-truth-check \
            --k "$BENCHMARK_K" \
            --modes "$BENCHMARK_MODES" \
            --corpus-dir pdf/public-corpus \
            --eval-file data/eval/public_pdf_ground_truth_cases.json \
            --json \
            --output benchmark-results/real-ground-truth.json

      - name: Enforce benchmark gate
        run: |
          uv run --frozen python - <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path("benchmark-results/real-ground-truth.json").read_text())
          result = payload["result"]
          quality_gate = result.get("quality_gate", {})
          mode_summaries = {
              item["mode"]: {
                  "pass_count": item.get("pass_count"),
                  "case_count": item.get("case_count"),
                  "summary": item.get("summary", {}),
              }
              for item in result.get("mode_results", [])
          }

          summary = [
              "Public-PDF retrieval benchmark",
              "",
              f"- k: {result.get('k')}",
              f"- modes: {', '.join(result.get('modes', []))}",
              f"- PDFs: {result.get('pdf_count')}",
              f"- cases: {result.get('case_count')}",
              f"- all_pass: {result.get('all_pass')}",
              f"- quality_gate.passed: {quality_gate.get('passed')}",
              "",
              "Mode summaries:",
          ]
          for mode, details in mode_summaries.items():
              metrics = details["summary"]
              summary.append(
                  "- "
                  f"{mode}: {details['pass_count']}/{details['case_count']} pass, "
                  f"MRR={metrics.get('mrr')}, "
                  f"recall@k={metrics.get('avg_recall_at_k')}, "
                  f"evidence_keywords={metrics.get('avg_evidence_keyword_coverage')}"
              )
          Path("benchmark-results/summary.md").write_text("\n".join(summary) + "\n")

          if not result.get("all_pass") or not quality_gate.get("passed"):
              print("\n".join(summary))
              sys.exit(1)
          PY

      - name: Publish benchmark summary
        run: cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-pdf-retrieval-benchmark
          path: benchmark-results/
