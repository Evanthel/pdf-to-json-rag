[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-json-rag"
version = "0.2.0"
description = "Local-first, domain-agnostic PDF-to-JSON RAG pipeline with structured extraction and document-aware retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Piotr Obiegly" }
]
dependencies = [
  "PyMuPDF",
  "pdf-inspector==0.2.7",
  "pytesseract",
  "Pillow",
  "pydantic",
  "chromadb<1.0.0",
  "numpy",
]

[project.urls]
Repository = "https://github.com/Evanthel/pdf-to-json-rag"
Issues = "https://github.com/Evanthel/pdf-to-json-rag/issues"

[project.optional-dependencies]
semantic = [
  "sentence-transformers",
]
tables = [
  "pdfplumber",
]
test = [
  "coverage[toml]>=7.10,<8",
]
typecheck = [
  "mypy>=1.18,<2",
]
quality = [
  "pip-audit>=2.10,<3",
  "ruff>=0.16,<1",
]

[project.scripts]
pdf-to-json-rag = "pdf_to_json_rag.cli:main"
pdf-to-json-rag-web = "pdf_to_json_rag.web:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdf_to_json_rag" = ["assets/examples/*.json", "assets/web/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli_public_surface.py" = ["E402"]
"tests/test_pdf_inspector_integration.py" = ["E402"]
"tests/test_web_app.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["pdf_to_json_rag"]
parallel = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 56
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = [
  "src/pdf_to_json_rag/answer_alignment.py",
  "src/pdf_to_json_rag/answer_contracts.py",
  "src/pdf_to_json_rag/config.py",
  "src/pdf_to_json_rag/document_family.py",
  "src/pdf_to_json_rag/llm_output.py",
  "src/pdf_to_json_rag/llm_runtime.py",
  "src/pdf_to_json_rag/quality.py",
  "src/pdf_to_json_rag/schemas.py",
]
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
