[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-json-rag"
version = "0.1.0"
description = "Local-first, domain-agnostic PDF-to-JSON RAG pipeline with structured extraction and document-aware retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Piotr Obiegly" }
]
dependencies = [
  "PyMuPDF",
  "pdf-inspector==0.2.6",
  "pytesseract",
  "Pillow",
  "pydantic",
  "chromadb<1.0.0",
  "sentence-transformers",
  "numpy",
]

[project.optional-dependencies]
tables = [
  "pdfplumber",
]

[project.scripts]
pdf-to-json-rag = "pdf_to_json_rag.cli:main"
pdf-to-json-rag-web = "pdf_to_json_rag.web:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdf_to_json_rag" = ["assets/examples/*.json", "assets/web/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli_public_surface.py" = ["E402"]
"tests/test_pdf_inspector_integration.py" = ["E402"]
"tests/test_web_app.py" = ["E402"]
